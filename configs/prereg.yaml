# Machine-readable pre-registered values (see PREREG.md for the rules).
# Fill the null entries after Phase 0 (NB02 prints proposals), then COMMIT this file before any Phase 1 run
# and record the commit hash in PREREG.md. make_manifest.py refuses to build a group whose values are missing.
N_star: 32                   # largest N with A1 mean recall >= 0.9 on plain MQAR (E0.4, NB02: A1 99.8% / 98.9% / 2.0% at N = 16 / 32 / 64)
phase1_steps: 6000           # E0.7 (NB04), A1 at F=512, lambda=0: first eval step >= 98% of max = 5750, rounded up to 500
seeds: [0, 1, 2]
lr_candidates: [3.0e-4, 1.0e-3, 3.0e-3]
lr:                          # E1.0a (NB10) by the pre-registered rule: best val_recall, ties -> smaller LR
  A1: 0.001                  # val recall 0.018 / 0.659 / 0.282 at 3e-4 / 1e-3 / 3e-3
  A2: 0.003                  # val recall 0.001 / 0.002 / 0.068 at 3e-4 / 1e-3 / 3e-3 (best at the grid edge)
primary_cell: {F: 512, P: 64, placement: a, filler_weight: 0.0}    # N = N_star; option A after E0.7 (PREREG.md 2026-10-20): answer-only loss
phase2_train_tokens: auto    # "auto" = rule from E2.0 throughput (see make_manifest.py); or an int
phase2_hours_per_run: 1.7
phase2_max_tokens: 150000000
