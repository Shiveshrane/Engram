# Phase 2 (small LM on FineWeb-Edu). Every arm file in this directory inherits it.
phase: phase2
group: misc
task: lm
seed: 0
data:
  path: /kaggle/input/engramdelta-lmdata   # output of notebooks/03_lm_data_prep (Kaggle Dataset)
  seq_len: 1024
model:
  d_model: 384
  n_layers: 8
  mixer: gdn
  n_heads: 6
  head_dim: 64
  mlp_hidden: 1024
  tie_embeddings: true
  gdn: {expand_v: 1.0, use_short_conv: true, conv_size: 4, use_gate: true, backend: torch, chunk_size: 64}
  swa: {enabled: false, layers: [1, 3], window: 16}
  engram:
    enabled: false
    layers: [1, 3]        # scaled from the paper's layers 2 and 6 of 12
    orders: [2, 3]
    n_heads_per_order: 8
    embed_per_order: 256
    rows_per_head: 14700  # -> about 15M table params, about 1x the backbone's non-embedding params
    kernel_size: 4
    conv_dilation: 3
    use_conv: true
    frozen_table: false
    seed: 0
    compress: true        # tokenizer compression (engram_compress.npy from the data prep)
train:
  steps: 1831             # replaced by the token budget from E2.0 (tokens / 65536)
  global_batch: 64        # 64 x 1024 tokens per step; per rank 16 x 2 micro-steps on 2 GPUs
  grad_accum: 2
  lr: 1.5e-3
  min_lr_ratio: 0.1
  warmup: 100
  weight_decay: 0.1
  betas: [0.9, 0.95]
  clip: 1.0
  precision: fp16
  log_every: 20
  eval_every: 0
  ckpt_every: 200
  hub_ckpt: true
  sync_check_every: 200
  save_final: true
  final_val_windows: 200
